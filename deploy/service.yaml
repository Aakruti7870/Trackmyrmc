# Cloud Run multi-container service: the app + a Cloud SQL Auth Proxy sidecar.
#
# WHY: the app disables Postgres TLS only when the DATABASE_URL host is the literal
# string "localhost". The proxy sidecar listens on 127.0.0.1:5432 (shared with the
# app container), so a `localhost` DATABASE_URL connects to the proxy with TLS off,
# and the proxy encrypts the hop to Cloud SQL. This keeps the app code unchanged.
#
# Deploy with:
#   gcloud run services replace deploy/service.yaml --region=asia-south1
#
# Replace every PLACEHOLDER before applying. Store secrets in Secret Manager and
# reference them with valueFrom.secretKeyRef (shown for JWT_SECRET / DATABASE_URL);
# add the rest from deploy/env.example the same way.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: concreteking
  labels:
    cloud.googleapis.com/location: asia-south1
spec:
  template:
    metadata:
      annotations:
        # Keep one warm instance so the in-process recurring scheduler keeps running.
        autoscaling.knative.dev/minScale: "1"
        # Point Cloud Run at the app container's port.
        run.googleapis.com/container-dependencies: '{"app":["cloudsql-proxy"]}'
    spec:
      # Long-lived SSE connections need a raised request timeout (max 3600s).
      timeoutSeconds: 3600
      # Runtime service account must have roles/cloudsql.client (+ secret access).
      serviceAccountName: PLACEHOLDER_SA@PROJECT_ID.iam.gserviceaccount.com
      containers:
        # ---- Application ----
        - name: app
          image: asia-south1-docker.pkg.dev/PROJECT_ID/concreteking/concreteking:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_URL
              value: "https://trackmyrmc.com"
            - name: PUBLIC_URL
              value: "https://trackmyrmc.com"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://trackmyrmc.com,https://www.trackmyrmc.com"
            # Host is literally "localhost" -> app runs with TLS off to the proxy.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: latest
            # ... add the remaining env vars / secrets from deploy/env.example here.

        # ---- Cloud SQL Auth Proxy sidecar (listens on 127.0.0.1:5432) ----
        - name: cloudsql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
          args:
            - "--address=0.0.0.0"
            - "--port=5432"
            - "PROJECT_ID:asia-south1:concreteking-db"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
