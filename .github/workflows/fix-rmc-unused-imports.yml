name: One-time RMC unused import cleanup

on:
  push:
    paths:
      - '.github/workflows/fix-rmc-unused-imports.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maharashtra-rmc-plant-discovery
          fetch-depth: 0
      - name: Remove unused icon imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rmc-app/src/pages/RmcPlantNetwork.tsx')
          text = path.read_text()
          before = """import {
            AlertTriangle, CheckCircle2, ChevronRight, Clock3, ExternalLink, Factory,
            Loader2, MapPin, Play, RefreshCw, Search, ShieldCheck, StopCircle, XCircle,
          } from 'lucide-react';"""
          after = """import {
            AlertTriangle, CheckCircle2, ChevronRight, ExternalLink,
            Loader2, MapPin, Play, RefreshCw, Search, StopCircle, XCircle,
          } from 'lucide-react';"""
          if before not in text:
              raise SystemExit('Expected lucide-react import block not found')
          path.write_text(text.replace(before, after, 1))
          PY
          rm .github/workflows/fix-rmc-unused-imports.yml
      - name: Commit minimal build fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rmc-app/src/pages/RmcPlantNetwork.tsx .github/workflows/fix-rmc-unused-imports.yml
          git commit -m 'fix: remove unused RMC Plant Network icon imports'
          git push origin HEAD:feature/maharashtra-rmc-plant-discovery
