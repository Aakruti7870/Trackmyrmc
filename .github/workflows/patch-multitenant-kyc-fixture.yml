name: Patch multitenant KYC fixture

on:
  push:
    branches:
      - fix/kyc-identity-order-gating-ui
    paths:
      - .github/workflows/patch-multitenant-kyc-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/kyc-identity-order-gating-ui
          fetch-depth: 0

      - name: Patch only the shared customer fixture and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          test_file = Path('server/src/test/multitenant.isolation.test.ts')
          text = test_file.read_text()
          old = """    plantId: opts.plantId ?? null,
              linkedClientId: opts.linkedClientId ?? null,
            }).returning();"""
          new = """    plantId: opts.plantId ?? null,
              linkedClientId: opts.linkedClientId ?? null,
              kycStatus: role === 'client' ? 'verified' : undefined,
            }).returning();"""
          if old not in text:
              raise SystemExit('Expected multitenant createUser fixture was not found; refusing to rewrite the file.')
          if text.count(old) != 1:
              raise SystemExit('Fixture match was not unique; refusing to rewrite the file.')
          test_file.write_text(text.replace(old, new, 1))
          Path('.github/workflows/patch-multitenant-kyc-fixture.yml').unlink()
          PY

      - name: Commit exact fixture correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/test/multitenant.isolation.test.ts .github/workflows/patch-multitenant-kyc-fixture.yml
          git commit -m "Mark multitenant customer fixtures as KYC verified"
          git push origin HEAD:fix/kyc-identity-order-gating-ui
