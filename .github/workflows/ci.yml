name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackmyrmc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d trackmyrmc_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackmyrmc_ci
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm --version

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: rmc-app
        run: pnpm install --frozen-lockfile

      - name: Server tests
        working-directory: server
        run: pnpm test

      - name: Server TypeScript build
        working-directory: server
        run: pnpm build

      - name: Frontend tests
        working-directory: rmc-app
        run: pnpm test

      - name: Frontend production build
        working-directory: rmc-app
        run: pnpm build
