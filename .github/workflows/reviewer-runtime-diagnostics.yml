name: Reviewer Runtime Diagnostics

on:
  push:
    branches:
      - ops/reviewer-runtime-setup-20260807
    paths:
      - .github/workflows/reviewer-runtime-diagnostics.yml

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
      - name: Read reviewer auth errors
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="trackmyrmc" AND timestamp>="2026-08-07T00:40:00Z" AND (textPayload:"reviewer-auth" OR jsonPayload.message:"reviewer-auth")' \
            --project "${{ secrets.GCP_PROJECT }}" \
            --limit=50 \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' \
            --order=desc
