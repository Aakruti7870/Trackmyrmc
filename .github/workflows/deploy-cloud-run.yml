# Deploy to Google Cloud Run on every push to main.
#
# Prerequisites (one-time setup in your GitHub repo Settings → Secrets):
#
#   GCP_SA_KEY   — Service account JSON key with these roles on the project:
#                  roles/run.admin, roles/cloudbuild.builds.editor,
#                  roles/artifactregistry.writer, roles/iam.serviceAccountUser
#   GCP_PROJECT  — Your GCP project ID  (e.g. trackmyrmc-production)
#
# The rest of the config (region, service name, Cloud SQL instance) is set
# in the env block below — update them if you ever rename the service.
#
# Secrets in the deployed container come from Secret Manager (wired in
# cloudbuild.yaml) — never hardcode them here.

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_REGION: asia-south1
  CLOUD_RUN_SERVICE: trackmyrmc
  ARTIFACT_REPO: cloud-run-source-deploy
  IMAGE_NAME: trackmyrmc/trackmyrmc
  CLOUDSQL_INSTANCE: trackmyrmc-production:asia-south1:trackmyrmc-prod-db

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Install gcloud beta component
        run: gcloud components install beta --quiet

      - name: Build & deploy via Cloud Build
        run: |
          # The beta command streams Cloud Logging output back into GitHub Actions.
          # This exposes the exact Cloud Run deployment error instead of only
          # reporting that a numbered Cloud Build step failed.
          gcloud beta builds submit --quiet \
            --config cloudbuild.yaml \
            --project "${{ secrets.GCP_PROJECT }}" \
            --substitutions "_REGION=${{ env.GCP_REGION }},_REPO=${{ env.ARTIFACT_REPO }},_IMAGE=${{ env.IMAGE_NAME }},_SERVICE=${{ env.CLOUD_RUN_SERVICE }},_CLOUDSQL_INSTANCE=${{ env.CLOUDSQL_INSTANCE }},COMMIT_SHA=${{ github.sha }}"

      - name: Verify TrackMyRMC privacy policy is live
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Waiting 30s for new revision to warm up..."
          sleep 30
          for attempt in {1..24}; do
            status="$(curl --location --silent --show-error --output /tmp/privacy-policy.html --write-out '%{http_code}' https://trackmyrmc.com/privacy_policy || true)"
            if [ "$status" = "200" ] \
              && grep -q "Privacy Policy" /tmp/privacy-policy.html \
              && grep -q "TrackMyRMC" /tmp/privacy-policy.html \
              && ! grep -q "CONCRETE KING" /tmp/privacy-policy.html; then
              echo "TrackMyRMC privacy policy is live and correctly branded."
              exit 0
            fi
            echo "Privacy policy verification attempt ${attempt}/24 returned HTTP ${status}."
            cat /tmp/privacy-policy.html 2>/dev/null | head -5 || true
            sleep 10
          done
          echo "WARNING: Privacy policy URL did not pass verification after 4 min — deploy still succeeded."
          cat /tmp/privacy-policy.html 2>/dev/null || true
