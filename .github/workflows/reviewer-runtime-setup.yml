name: Reviewer Runtime Secure Setup

on:
  push:
    branches:
      - ops/reviewer-runtime-setup-20260807
    paths:
      - .github/workflows/reviewer-runtime-setup.yml

permissions:
  contents: read

jobs:
  configure-and-smoke-test:
    runs-on: ubuntu-latest
    env:
      GCP_REGION: asia-south1
      CLOUD_RUN_SERVICE: trackmyrmc
      REVIEW_OWNER_EMAIL_CT: 
      REVIEW_OWNER_PASSWORD_CT: 
      REVIEW_OWNER_PLANT_NAME_CT: 
      REVIEW_DRIVER_PHONE_CT: 
      REVIEW_DRIVER_OTP_CT: 
      REVIEW_DRIVER_PLANT_NAME_CT: 

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Decrypt reviewer configuration and update Cloud Run
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const sa = JSON.parse(process.env.GCP_SA_KEY);
          if (!sa.private_key) throw new Error('Invalid GCP_SA_KEY');
          fs.writeFileSync('/tmp/reviewer-private.pem', sa.private_key, { mode: 0o600 });
          NODE

          decrypt() {
            printf '%s' "$1" | base64 -d | openssl pkeyutl -decrypt \
              -inkey /tmp/reviewer-private.pem \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256
          }

          OWNER_EMAIL="$(decrypt "$REVIEW_OWNER_EMAIL_CT")"
          OWNER_PASSWORD="$(decrypt "$REVIEW_OWNER_PASSWORD_CT")"
          OWNER_PLANT="$(decrypt "$REVIEW_OWNER_PLANT_NAME_CT")"
          DRIVER_PHONE="$(decrypt "$REVIEW_DRIVER_PHONE_CT")"
          DRIVER_OTP="$(decrypt "$REVIEW_DRIVER_OTP_CT")"
          DRIVER_PLANT="$(decrypt "$REVIEW_DRIVER_PLANT_NAME_CT")"

          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project "${{ secrets.GCP_PROJECT }}" \
            --region "$GCP_REGION" \
            --quiet \
            --update-env-vars "REVIEW_OWNER_EMAIL=$OWNER_EMAIL,REVIEW_OWNER_PASSWORD=$OWNER_PASSWORD,REVIEW_OWNER_PLANT_NAME=$OWNER_PLANT,REVIEW_DRIVER_PHONE=$DRIVER_PHONE,REVIEW_DRIVER_OTP=$DRIVER_OTP,REVIEW_DRIVER_PLANT_NAME=$DRIVER_PLANT" >/tmp/reviewer-run-update.log

          # Confirm only the variable NAMES are present. Never print the values.
          ENV_NAMES="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "${{ secrets.GCP_PROJECT }}" \
            --region "$GCP_REGION" \
            --format='value(spec.template.spec.containers[0].env[].name)')"
          for key in REVIEW_OWNER_EMAIL REVIEW_OWNER_PASSWORD REVIEW_OWNER_PLANT_NAME REVIEW_DRIVER_PHONE REVIEW_DRIVER_OTP REVIEW_DRIVER_PLANT_NAME; do
            printf '%s\n' "$ENV_NAMES" | grep -q "$key" || { echo "Missing runtime variable: $key"; exit 1; }
          done
          echo "Reviewer runtime variables are configured on Cloud Run."

          export OWNER_EMAIL OWNER_PASSWORD OWNER_PLANT DRIVER_PHONE DRIVER_OTP DRIVER_PLANT
          rm -f /tmp/reviewer-private.pem

      - name: Smoke-test live reviewer Owner and Driver login
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const sa = JSON.parse(process.env.GCP_SA_KEY);
          if (!sa.private_key) throw new Error('Invalid GCP_SA_KEY');
          fs.writeFileSync('/tmp/reviewer-private.pem', sa.private_key, { mode: 0o600 });
          function decrypt(name) {
            const ciphertext = Buffer.from(process.env[name], 'base64');
            const out = execFileSync('openssl', [
              'pkeyutl', '-decrypt', '-inkey', '/tmp/reviewer-private.pem',
              '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256',
            ], { input: ciphertext });
            return out.toString('utf8');
          }
          const ownerEmail = decrypt('REVIEW_OWNER_EMAIL_CT');
          const ownerPassword = decrypt('REVIEW_OWNER_PASSWORD_CT');
          const driverPhone = decrypt('REVIEW_DRIVER_PHONE_CT');
          const driverOtp = decrypt('REVIEW_DRIVER_OTP_CT');
          const base = 'https://trackmyrmc.com/api/auth';

          async function post(path, body) {
            const res = await fetch(base + path, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body),
            });
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch {}
            if (!res.ok) throw new Error(`${path} returned HTTP ${res.status}: ${json.error || 'non-JSON error'}`);
            return json;
          }

          (async () => {
            let healthy = false;
            for (let i = 0; i < 18; i++) {
              try {
                const r = await fetch('https://trackmyrmc.com/api/health', { cache: 'no-store' });
                if (r.ok) { healthy = true; break; }
              } catch {}
              await new Promise(r => setTimeout(r, 5000));
            }
            if (!healthy) throw new Error('Production health endpoint did not become ready');

            const method = await post('/staff/login-method', { email: ownerEmail });
            if (method.method !== 'password') throw new Error(`Owner login-method was ${method.method}`);

            const owner = await post('/login', { email: ownerEmail, password: ownerPassword });
            if (!owner.token || owner.user?.role !== 'plant_owner' || !owner.user?.plantId) {
              throw new Error('Owner reviewer login did not return a plant-scoped plant_owner session');
            }
            console.log('Owner reviewer login: PASS (plant_owner, plant-scoped).');

            const sent = await post('/otp/send', { phone: driverPhone });
            if (!sent.ok || sent.channel !== 'review') throw new Error('Driver reviewer OTP send did not use review channel');

            const driver = await post('/otp/verify', { phone: driverPhone, code: driverOtp });
            if (!driver.token || driver.user?.role !== 'driver' || !driver.user?.plantId || !driver.user?.linkedDriverId) {
              throw new Error('Driver reviewer login did not return a plant-scoped driver session');
            }
            console.log('Driver reviewer login: PASS (driver, plant-scoped).');
            fs.rmSync('/tmp/reviewer-private.pem', { force: true });
          })().catch((err) => {
            fs.rmSync('/tmp/reviewer-private.pem', { force: true });
            console.error(err.message);
            process.exit(1);
          });
          NODE
