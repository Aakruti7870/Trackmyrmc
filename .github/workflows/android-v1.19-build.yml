name: Android v1.19 Build

on:
  pull_request:
    paths:
      - 'rmc-app/**'
      - '.github/workflows/android-v1.19-build.yml'
  workflow_dispatch:

jobs:
  build-unsigned-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rmc-app/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android app dependencies
        working-directory: rmc-app
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor
        working-directory: rmc-app
        env:
          VITE_API_BASE_URL: https://trackmyrmc.com
          VITE_DISABLE_PWA: '1'
        run: |
          pnpm build:native
          pnpm exec cap sync android

      - name: Build unsigned release AAB
        working-directory: rmc-app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyRMC-v1.19-vc20-unsigned
          path: rmc-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
