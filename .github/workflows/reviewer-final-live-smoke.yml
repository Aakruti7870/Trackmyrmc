name: Reviewer Final Live Smoke

on:
  push:
    branches:
      - ops/reviewer-runtime-setup-20260807
    paths:
      - .github/workflows/reviewer-final-live-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      REGION: asia-south1
      SERVICE: trackmyrmc
      EXPECTED_SHA: 30808319df766c05835afe0b08a8c7f6e7e30d18
      REVIEW_OWNER_EMAIL_CT: 
      REVIEW_OWNER_PASSWORD_CT: 
      REVIEW_DRIVER_PHONE_CT: 
      REVIEW_DRIVER_OTP_CT: 

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Wait for exact production revision
        run: |
          set -euo pipefail
          for i in {1..60}; do
            IMAGE="$(gcloud run services describe "$SERVICE" --project='${{ secrets.GCP_PROJECT }}' --region="$REGION" --format='value(spec.template.spec.containers[0].image)')"
            if [[ "$IMAGE" == *"$EXPECTED_SHA"* ]]; then
              echo "Expected production image is active."
              exit 0
            fi
            sleep 5
          done
          echo "Expected production image did not become active." >&2
          exit 1

      - name: Verify Owner and Driver reviewer login
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const sa = JSON.parse(process.env.GCP_SA_KEY);
          if (!sa.private_key) throw new Error('Invalid GCP_SA_KEY');
          fs.writeFileSync('/tmp/reviewer-key.pem', sa.private_key, { mode: 0o600 });
          function decrypt(name) {
            return execFileSync('openssl', [
              'pkeyutl','-decrypt','-inkey','/tmp/reviewer-key.pem',
              '-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256',
            ], { input: Buffer.from(process.env[name], 'base64') }).toString('utf8');
          }
          const ownerEmail = decrypt('REVIEW_OWNER_EMAIL_CT');
          const ownerPassword = decrypt('REVIEW_OWNER_PASSWORD_CT');
          const driverPhone = decrypt('REVIEW_DRIVER_PHONE_CT');
          const driverOtp = decrypt('REVIEW_DRIVER_OTP_CT');
          for (const value of [ownerEmail, ownerPassword, driverPhone, driverOtp]) console.log(`::add-mask::${value}`);
          const service = 'https://trackmyrmc-354617160430.asia-south1.run.app';
          const base = service + '/api/auth';

          async function post(path, body) {
            const res = await fetch(base + path, {
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify(body),
            });
            const text = await res.text();
            let json = {};
            try { json = JSON.parse(text); } catch {}
            if (!res.ok) throw new Error(`${path} HTTP ${res.status}: ${json.error || 'non-JSON error'}`);
            return json;
          }

          (async () => {
            const health = await fetch(service + '/api/health', { cache:'no-store' });
            if (!health.ok) throw new Error(`health HTTP ${health.status}`);

            const method = await post('/staff/login-method', { email:ownerEmail });
            if (method.method !== 'password') throw new Error(`Owner reviewer login method is ${method.method}`);

            const owner = await post('/login', { email:ownerEmail, password:ownerPassword });
            if (!owner.token || owner.user?.role !== 'plant_owner' || !owner.user?.plantId) {
              throw new Error('Owner reviewer did not receive a plant-scoped plant_owner session');
            }
            console.log('OWNER REVIEWER LOGIN: PASS');

            const send = await post('/otp/send', { phone:driverPhone });
            if (!send.ok || send.channel !== 'review' || send.devCode !== undefined) {
              throw new Error('Driver reviewer OTP send did not use secure review channel');
            }

            const driver = await post('/otp/verify', { phone:driverPhone, code:driverOtp });
            if (!driver.token || driver.user?.role !== 'driver' || !driver.user?.plantId || !driver.user?.linkedDriverId) {
              throw new Error('Driver reviewer did not receive a plant-scoped driver session');
            }
            if (Number(driver.user.plantId) !== Number(owner.user.plantId)) {
              throw new Error('Owner and Driver reviewer accounts are not scoped to the same plant');
            }
            console.log('DRIVER REVIEWER LOGIN: PASS');
            console.log('REVIEWER PLANT SCOPE: PASS');
            fs.rmSync('/tmp/reviewer-key.pem', { force:true });
          })().catch((err) => {
            fs.rmSync('/tmp/reviewer-key.pem', { force:true });
            console.error(err.message);
            process.exit(1);
          });
          NODE
