name: Android Signed Play Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/release-v1.29.trigger

permissions:
  contents: write

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rmc-app/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android API 36
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Android app dependencies
        working-directory: rmc-app
        run: pnpm install --frozen-lockfile

      - name: Validate release metadata and policy source
        working-directory: rmc-app
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.29.0') throw new Error('Expected package version 1.29.0')"
          grep -Eq 'versionCode[[:space:]]+30\b' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+\"1\.29\"' android/app/build.gradle
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36\b' android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36\b' android/variables.gradle
          grep -Eq "com.android.tools.build:gradle:8\.10\.1" android/build.gradle
          grep -Fq "CONCRETE KING" src/pages/DeleteAccount.tsx
          grep -Fq "com.trackmyrmc.concreteking" src/pages/DeleteAccount.tsx
          grep -Fq "CONCRETE KING" src/pages/Privacy.tsx
          grep -Fq "com.trackmyrmc.concreteking" src/pages/Privacy.tsx
          grep -Eq '\"@capacitor/android\":[[:space:]]*\"\^7\.6\.7\"' package.json
          grep -Eq '\"@capacitor/core\":[[:space:]]*\"\^7\.6\.7\"' package.json
          grep -Eq '\"@capacitor/cli\":[[:space:]]*\"\^7\.6\.7\"' package.json
          pnpm lint
          pnpm test

      - name: Build web assets and sync Capacitor
        working-directory: rmc-app
        env:
          VITE_API_BASE_URL: https://trackmyrmc.com
          VITE_DISABLE_PWA: '1'
        run: |
          pnpm build:native
          pnpm exec cap sync android

      - name: Build release AAB
        working-directory: rmc-app/android
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease --stacktrace

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trackmyrmc-upload.p12"
          test -s "$RUNNER_TEMP/trackmyrmc-upload.p12"
          chmod 600 "$RUNNER_TEMP/trackmyrmc-upload.p12"

      - name: Verify keystore and alias
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$RUNNER_TEMP/trackmyrmc-upload.p12" \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Sign and verify release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SOURCE_AAB="rmc-app/android/app/build/outputs/bundle/release/app-release.aab"
          RELEASE_DIR="releases"
          RELEASE_AAB="$RELEASE_DIR/app-release-v1.29-vc30-signed.aab"
          test -s "$SOURCE_AAB"
          jarsigner \
            -keystore "$RUNNER_TEMP/trackmyrmc-upload.p12" \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$SOURCE_AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$SOURCE_AAB"
          mkdir -p "$RELEASE_DIR"
          cp "$SOURCE_AAB" "$RELEASE_AAB"
          sha256sum "$RELEASE_AAB" | tee "$RELEASE_AAB.sha256"

      - name: Upload Play Console artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyRMC-v1.29-vc30-signed-play-console
          path: |
            releases/app-release-v1.29-vc30-signed.aab
            releases/app-release-v1.29-vc30-signed.aab.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified signed AAB to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/app-release-v1.29-vc30-signed.aab releases/app-release-v1.29-vc30-signed.aab.sha256
          git commit -m "release(android): add signed v1.29 vc30 AAB"
          git push

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/trackmyrmc-upload.p12"
