name: Android Signed Play Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/android-v1.26-vc27-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rmc-app/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android app dependencies
        working-directory: rmc-app
        run: pnpm install --frozen-lockfile

      - name: Validate release metadata and source
        working-directory: rmc-app
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='1.26.0') throw new Error('Expected package version 1.26.0')"
          grep -Eq 'versionCode[[:space:]]+27\b' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+\"1\.26\"' android/app/build.gradle
          grep -Eq '\"@capacitor/android\":[[:space:]]*\"\^7\.6\.7\"' package.json
          grep -Eq '\"@capacitor/core\":[[:space:]]*\"\^7\.6\.7\"' package.json
          grep -Eq '\"@capacitor/cli\":[[:space:]]*\"\^7\.6\.7\"' package.json
          pnpm lint
          pnpm test

      - name: Build web assets and sync Capacitor
        working-directory: rmc-app
        env:
          VITE_API_BASE_URL: https://trackmyrmc.com
          VITE_DISABLE_PWA: '1'
        run: |
          pnpm build:native
          pnpm exec cap sync android

      - name: Build release AAB
        working-directory: rmc-app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trackmyrmc-upload.p12"
          test -s "$RUNNER_TEMP/trackmyrmc-upload.p12"
          chmod 600 "$RUNNER_TEMP/trackmyrmc-upload.p12"

      - name: Verify keystore and alias
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$RUNNER_TEMP/trackmyrmc-upload.p12" \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Sign release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB="rmc-app/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner \
            -keystore "$RUNNER_TEMP/trackmyrmc-upload.p12" \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" "$ANDROID_KEY_ALIAS"

      - name: Verify signed AAB
        run: |
          set -euo pipefail
          AAB="rmc-app/android/app/build/outputs/bundle/release/app-release.aab"
          jarsigner -verify -verbose -certs "$AAB"
          sha256sum "$AAB" | tee rmc-app/android/app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Upload Play Console artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyRMC-v1.26-vc27-signed-play-console
          path: |
            rmc-app/android/app/build/outputs/bundle/release/app-release.aab
            rmc-app/android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14
