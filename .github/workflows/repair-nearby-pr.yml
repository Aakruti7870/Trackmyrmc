name: Repair Nearby Plants PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/nearby-plants-bottom-navigation
          fetch-depth: 0

      - name: Apply deterministic repair
        run: python3 scripts/repair_nearby.py

      - name: Commit repaired files
        run: |
          if git diff --quiet; then
            echo 'Already repaired.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add server/src/routes/plants.ts rmc-app/src/pages/NearbyPlants.tsx
            git add -u rmc-app/src/components/Bottomnav.tsx 2>/dev/null || true
            git commit -m 'fix: harden nearby plants API and frontend handling'
            git push origin HEAD:fix/nearby-plants-bottom-navigation
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rmc-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: rmc-app
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: rmc-app
        run: pnpm test

      - name: Build
        working-directory: rmc-app
        env:
          VITE_API_BASE_URL: https://trackmyrmc.com
          VITE_DISABLE_PWA: '1'
        run: pnpm build

      - name: Create source ZIP
        run: git archive --format=zip --output=TrackMyRMC-nearby-plants-fixed-source.zip HEAD

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyRMC-nearby-plants-fixed-source
          path: TrackMyRMC-nearby-plants-fixed-source.zip
          retention-days: 14
