<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#08111f"/>

  <!-- Crown shape -->
  <g fill="#f7c948">
    <!-- Crown base bar -->
    <rect x="38" y="108" width="104" height="18" rx="5"/>

    <!-- Three crown points -->
    <!-- Left point -->
    <polygon points="38,108 38,68 58,88 70,60 70,108"/>
    <!-- Middle point (tallest) -->
    <polygon points="70,108 70,60 90,44 110,60 110,108"/>
    <!-- Right point -->
    <polygon points="110,108 110,60 122,88 142,68 142,108"/>

    <!-- Crown jewels (circles on points) -->
    <circle cx="90" cy="44" r="7"/>
    <circle cx="58" cy="70" r="5.5"/>
    <circle cx="122" cy="70" r="5.5"/>
  </g>

  <!-- "CK" lettermark below crown -->
  <text x="90" y="148" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="22" fill="#f7c948" text-anchor="middle" letter-spacing="4">CK</text>
</svg>
