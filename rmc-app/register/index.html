<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Create Account | Concrete King</title>

    <!-- Auth utility page — do not index; follow outbound links -->
    <meta name="robots" content="noindex,follow" />
    <meta name="description" content="Create your Concrete King account to start ordering ready-mix concrete and tracking deliveries from approved RMC plants near you." />

    <!-- No canonical: noindex pages should not declare a canonical -->
    <!-- No Open Graph / Twitter Card: sharing a registration page is not intended -->
  </head>
  <body>
    <!--
      Minimal static content for non-JS crawlers.
      React mounts into #root and replaces this markup for interactive users.
    -->
    <div id="root">
      <div style="font-family:system-ui,sans-serif;background:#08111f;color:#e7ecf3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">
        <strong style="font-size:22px;margin-bottom:8px"><span style="color:#fff">CONCRETE </span><span style="color:#f7c948">KING</span></strong>
        <h1 style="font-size:24px;font-weight:700;margin:0 0 8px">Create Account</h1>
        <p style="color:#94a3b8;font-size:15px;margin:0">Register to order ready-mix concrete from approved RMC plants.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
