# Cloud Build pipeline: build the container, push it to Artifact Registry, and
# deploy to Cloud Run. Run with:
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_REPO=cloud-run-source-deploy,_IMAGE=trackmyrmc/trackmyrmc,_SERVICE=trackmyrmc,_CLOUDSQL_INSTANCE=trackmyrmc-production:asia-south1:trackmyrmc-prod-db
#
# The image path (repo + image name + tag) is identical across the build, push,
# and deploy steps:
#   ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}
# e.g. asia-south1-docker.pkg.dev/trackmyrmc-production/cloud-run-source-deploy/trackmyrmc/trackmyrmc:<commit-sha>
#
# Secrets are injected from Secret Manager at runtime via --set-secrets (see the
# deploy step below and deploy/GCLOUD_DEPLOY.md) so they are never baked into the
# image. This step wires the full set of Secret Manager secrets and connects to
# Cloud SQL over the built-in Auth-proxy Unix socket.
#
# DATABASE CONNECTIVITY: this deploy uses Cloud Run's built-in Cloud SQL
# connection (`--add-cloudsql-instances`), which exposes a Unix socket at
# /cloudsql/<INSTANCE_CONNECTION_NAME>. Because the app disables Postgres TLS only
# when DATABASE_URL contains the literal string "localhost", the DATABASE_URL
# secret MUST be of the form (note both the `localhost` authority AND the socket
# `host` query param — the query param is the real connection target, localhost is
# only there to keep the app's TLS-off path; see deploy/GCLOUD_DEPLOY.md):
#
#   postgresql://USER:PASSWORD@localhost/trackmyrmc?host=/cloudsql/trackmyrmc-production:asia-south1:trackmyrmc-prod-db
#
# (The Auth-Proxy sidecar manifest deploy/service.yaml remains an alternative; do
# NOT mix the two paths.)

substitutions:
  _REGION: "asia-south1"
  _REPO: "cloud-run-source-deploy"
  _IMAGE: "trackmyrmc/trackmyrmc"
  _SERVICE: "trackmyrmc"
  _CLOUDSQL_INSTANCE: "trackmyrmc-production:asia-south1:trackmyrmc-prod-db"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}"

steps:
  # 1) Build the image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}"
      - "."

  # 2) Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}"

  # 3) Deploy to Cloud Run
  #    - min-instances=1 keeps the in-process recurring scheduler alive
  #      (it would stop if the service scaled to zero).
  #    - timeout=3600 supports long-lived SSE connections.
  #    - add-cloudsql-instances mounts the Cloud SQL Unix socket at /cloudsql/<inst>.
  #    - All secrets come from Secret Manager via --set-secrets (never baked in).
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--min-instances=1"
      - "--timeout=3600"
      - "--cpu=1"
      - "--memory=1Gi"
      - "--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}"
      # Non-secret runtime config stays as plain env vars. CORS_ALLOWED_ORIGINS holds a
      # comma, so use gcloud's alternate-delimiter form (^|^ = split on `|`) — a plain
      # comma would be mis-parsed as a new var.
      - "--set-env-vars=^|^NODE_ENV=production|APP_URL=https://trackmyrmc.com|PUBLIC_URL=https://trackmyrmc.com|CORS_ALLOWED_ORIGINS=https://trackmyrmc.com,https://www.trackmyrmc.com"
      # Every secret injected from Secret Manager (KEY=SECRET_NAME:VERSION). This list
      # mirrors the secrets that exist in Secret Manager AND are read by server/src.
      # NOTE: APP_URL is set as a plain env var above (per requirement), so the APP_URL
      # secret is intentionally NOT referenced here (a var can't be both).
      # NOTE: these secrets are also present in Secret Manager but are NOT read by the
      # current code, so injecting them is harmless but unnecessary — included for
      # completeness: SESSION_SECRET, DEFAULT_OBJECT_STORAGE_BUCKET_ID, MANUS_API_KEY,
      # SLACK_TEST_API_KEY, WHATSAPP_META_REGISTER_PIN.
      # All code-referenced secrets now exist in Secret Manager and are wired below (37).
      - "--set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,SESSION_SECRET=SESSION_SECRET:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,GOOGLE_PLACES_API_KEY=GOOGLE_PLACES_API_KEY:latest,AI_INTEGRATIONS_GEMINI_API_KEY=AI_INTEGRATIONS_GEMINI_API_KEY:latest,AI_INTEGRATIONS_GEMINI_BASE_URL=AI_INTEGRATIONS_GEMINI_BASE_URL:latest,DEFAULT_OBJECT_STORAGE_BUCKET_ID=DEFAULT_OBJECT_STORAGE_BUCKET_ID:latest,PRIVATE_OBJECT_DIR=PRIVATE_OBJECT_DIR:latest,PUBLIC_OBJECT_SEARCH_PATHS=PUBLIC_OBJECT_SEARCH_PATHS:latest,SMTP_FROM=SMTP_FROM:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,SMTP_SYNC_FROM_ENV=SMTP_SYNC_FROM_ENV:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_VERIFY_SERVICE_SID=TWILIO_VERIFY_SERVICE_SID:latest,TWILIO_WHATSAPP_FROM=TWILIO_WHATSAPP_FROM:latest,WHATSAPP_META_ACCESS_TOKEN=WHATSAPP_META_ACCESS_TOKEN:latest,WHATSAPP_META_REGISTER_PIN=WHATSAPP_META_REGISTER_PIN:latest,WHATSAPP_META_VERIFY_TOKEN=WHATSAPP_META_VERIFY_TOKEN:latest,WHATSAPP_META_PHONE_NUMBER_ID=WHATSAPP_META_PHONE_NUMBER_ID:latest,WHATSAPP_META_OTP_TEMPLATE=WHATSAPP_META_OTP_TEMPLATE:latest,WHATSAPP_META_APP_SECRET=WHATSAPP_META_APP_SECRET:latest,VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest,VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest,MANUS_API_KEY=MANUS_API_KEY:latest,SLACK_TEST_API_KEY=SLACK_TEST_API_KEY:latest,AUTHORITY_BOOTSTRAP_PASSWORD=AUTHORITY_BOOTSTRAP_PASSWORD:latest,AUTHORITY_EMAILS=AUTHORITY_EMAILS:latest,REVIEW_DEMO_EMAIL=REVIEW_DEMO_EMAIL:latest,REVIEW_DEMO_OTP=REVIEW_DEMO_OTP:latest,KYC_API_KEY=KYC_API_KEY:latest,KYC_API_SECRET=KYC_API_SECRET:latest"

options:
  logging: CLOUD_LOGGING_ONLY
